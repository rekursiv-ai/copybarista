# DO NOT EDIT -- generated from package-validation.yml.tmpl and this
# package's sync config. Hand edits are overwritten; change
# the template, the generator, or the sync config instead.
name: Package validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep fd-find
      - name: Validate package
        run: |
          python copybarista/scripts/check_release_tree.py . --allow-root-git
          uv sync --all-groups
          uv run --all-groups ruff check --no-fix --no-cache .
          uv run --all-groups ruff format --check --no-cache .
          uv run --all-groups codespell .
          uv run --all-groups ty check
          uv run --all-groups basedpyright copybarista
          uv run --all-groups pytest
          uv run --all-groups pytest -m ci_smoke -o addopts="--durations=20" || test "$?" = 5
          uv build --out-dir dist
          wheel="$(ls dist/copybarista-*.whl | head -n 1)"; uv run --isolated --with "$wheel" python -c "import copybarista; from copybarista.cli import main; print('ok')"
